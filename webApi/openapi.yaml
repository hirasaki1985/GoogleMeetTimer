openapi: 3.0.0
info:
  title: GoogleMeetTimer WEB API
  version: 1.0.0
paths:
  /heartbeat:
    $ref: './apis/heartbeat.yaml#/paths/~1heartbeat'
  /speechTextSignedUrl:
    $ref: './apis/speechTextSignedUrl.yaml#/paths/~1speechTextSignedUrl'
  /fetchVoice:
    $ref: './apis/fetchVoice.yaml#/paths/~1fetchVoice'
components:
  responses:
    Found:
      description: Found
      headers:
        Location:
          schema:
            type: string
            format: uri
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebApiErrorResponse'
    Unauthorized:
      description: Unauthorized request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebApiErrorResponse'
    Forbidden:
      description: Forbidden request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebApiErrorResponse'
    NotFound:
      description: NotFound request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebApiErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebApiErrorResponse'
  schemas:
    WebApiErrorResponseMessage:
      type: object
      properties:
        type:
          type: string
          default: ""
        message:
          type: string
          default: "An error occurred"
      required:
        - type
        - message
    WebApiErrorResponse:
      type: object
      properties:
        data:
          type: object
        success:
          type: boolean
          default: false
        messages:
          type: array
          items:
              $ref: "#/components/schemas/WebApiErrorResponseMessage"
